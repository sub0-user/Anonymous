name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Privacy check — no internal files tracked
        run: |
          if git ls-files | grep -Eq '(^doc/|AGENTS\.md|CLAUDE\.md|CHANGELOG\.md|guide/dev/)'; then
            echo "❌ Internal files are tracked."; exit 1
          fi
          echo "✅ No internal files tracked."

      - name: Quality gate (xvfb for headless JavaFX tests)
        run: xvfb-run -a ./gradlew check
