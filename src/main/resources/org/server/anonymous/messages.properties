settings.support.hint=Anonymous is free and open source — no ads, no trackers, no paywall. If it is useful to you, a donation keeps development and the Tor nodes running.
settings.support.donate=Donate via PayPal
settings.support.after=PayPal payment opens in your browser — the app itself never connects anywhere.
settings.connect=CONNECT WITH THE CREATOR
settings.connect.hint=Follow the project and say hi on any platform you like.
settings.connect.out=Links open in your browser, only when you click them.
rules.number=Your .onion address IS your number — share it, it never changes.
rules.encryption=Messages are end-to-end encrypted and travel only between you and your contact, over Tor.
rules.no_server=There is no central server, no phone number, no account, no tracking.
rules.no_files=Files are never sent through Anonymous, by design. Share payloads yourself — Anonymous handles communication only.
rules.requests=Strangers' messages go to Requests until you approve them.
rules.verify=Verify the safety number out of band (call, meet) once, to defeat impersonation.
rules.rooms=Chatrooms live on the founder's node — the founder is the admin. They can read the room, rename members, and remove them (removal rotates the room key). Private rooms admit only invited members (Tor client auth); public rooms admit anyone with the entry key. Text only, no media.

