settings.rules=OUR RULES
settings.rules.hint=Decisions we made, and why.
settings.guide=QUICK GUIDE
settings.guide.hint=How to use Anonymous, in a few steps.
guide.one=Your .onion address is your number. Share it, or add a contact by pasting theirs.
guide.two=Message a new contact once — that exchanges keys and shows the safety number.
guide.three=Create a room and invite anyone from your contacts. Being a contact is trust enough.
guide.four=Invites arrive as a chat message — tap "Accept invite" to join.
guide.five=Members can leave anytime; only the founder can delete the room.
guide.six=Back up your identity — without a backup, a lost device loses your number.
settings.support=SUPPORT
settings.support.hint=Anonymous is free and open source — no ads, no trackers, no paywall. If it is useful to you, a donation keeps development and the Tor nodes running.
settings.support.donate=Donate via PayPal
settings.support.after=PayPal payment opens in your browser — the app itself never connects anywhere.
settings.connect=CONNECT WITH THE CREATOR
settings.connect.hint=Follow the project and say hi on any platform you like.
settings.connect.out=Links open in your browser, only when you click them.
settings.social.x=X / Twitter
settings.social.github=GitHub
settings.social.youtube=YouTube
settings.social.instagram=Instagram
rules.number=Your .onion address IS your number — share it, it never changes.
rules.encryption=Messages are end-to-end encrypted and travel only between you and your contact, over Tor.
rules.no_server=There is no central server, no phone number, no account, no tracking.
rules.no_files=Files are never sent through Anonymous, by design. Share payloads yourself — Anonymous handles communication only.
rules.requests=Strangers' messages go to Requests until you approve them.
rules.verify=Verify the safety number out of band (call, meet) once, to defeat impersonation.
rules.invites=Anyone in your contacts can be added to a room — being a contact already means trust. The invite arrives as a chat message; tap "Accept invite" to join.
rules.rooms=Chatrooms live on the founder's node — the founder is the admin. Rooms are private by default: you can only be in a room by being invited, never by searching or pasting a code. Members can leave anytime; the founder can remove members or delete the room. Text only, no media.

